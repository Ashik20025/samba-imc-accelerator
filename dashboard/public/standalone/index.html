<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SAMBA React Material UI Dashboard</title>
    <link rel="preconnect" href="https://unpkg.com" />
    <style>
      body {
        margin: 0;
        background: #f5f7fb;
      }
      .bar-track {
        height: 12px;
        border-radius: 999px;
        overflow: hidden;
        background: #e7ebf2;
        margin-top: 6px;
      }
      .bar-fill {
        height: 100%;
        border-radius: 999px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/@emotion/react@11.11.4/dist/emotion-react.umd.min.js"></script>
    <script src="https://unpkg.com/@emotion/styled@11.11.5/dist/emotion-styled.umd.min.js"></script>
    <script src="https://unpkg.com/@mui/material@5.15.20/umd/material-ui.production.min.js"></script>

    <script type="text/babel">
      const {
        AppBar,
        Box,
        Button,
        Chip,
        Container,
        CssBaseline,
        Divider,
        FormControl,
        InputLabel,
        LinearProgress,
        MenuItem,
        Paper,
        Select,
        Stack,
        Table,
        TableBody,
        TableCell,
        TableContainer,
        TableHead,
        TableRow,
        ThemeProvider,
        ToggleButton,
        ToggleButtonGroup,
        Toolbar,
        Typography,
        createTheme,
      } = MaterialUI;

      const theme = createTheme({
        palette: {
          primary: { main: '#1f5fbf' },
          secondary: { main: '#0f8f71' },
          background: { default: '#f5f7fb', paper: '#ffffff' },
          text: { primary: '#172033', secondary: '#5d6980' },
        },
        shape: { borderRadius: 8 },
        typography: {
          fontFamily:
            'Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif',
          h4: { fontWeight: 760, letterSpacing: 0 },
          h6: { fontWeight: 720, letterSpacing: 0 },
        },
      });

      function fmt(value, digits = 2) {
        return new Intl.NumberFormat('en-US', {
          maximumFractionDigits: digits,
          minimumFractionDigits: digits,
        }).format(value ?? 0);
      }

      function MetricTile({ label, value, sub }) {
        return (
          <Paper variant="outlined" sx={{ p: 2.5, minHeight: 116 }}>
            <Typography variant="body2" color="text.secondary">
              {label}
            </Typography>
            <Typography variant="h5" sx={{ mt: 0.5 }}>
              {value}
            </Typography>
            <Typography variant="caption" color="text.secondary">
              {sub}
            </Typography>
          </Paper>
        );
      }

      function BarList({ rows, metric }) {
        const max = Math.max(...rows.map((row) => row[metric]), 1);
        return (
          <Stack spacing={1.5}>
            {rows.map((row) => (
              <Box key={`${row.experiment}-${row.variant}-${metric}`}>
                <Stack direction="row" justifyContent="space-between" gap={2}>
                  <Typography variant="body2" sx={{ maxWidth: '72%', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                    {row.experiment}
                  </Typography>
                  <Typography variant="body2" fontWeight={700}>
                    {fmt(row[metric], 3)}x
                  </Typography>
                </Stack>
                <div className="bar-track">
                  <div
                    className="bar-fill"
                    style={{
                      width: `${Math.max(4, (row[metric] / max) * 100)}%`,
                      background: metric.includes('energy') ? '#0f8f71' : '#1f5fbf',
                    }}
                  />
                </div>
              </Box>
            ))}
          </Stack>
        );
      }

      function VariantTable({ rows }) {
        return (
          <TableContainer component={Paper} variant="outlined">
            <Table size="small">
              <TableHead>
                <TableRow>
                  <TableCell>Experiment</TableCell>
                  <TableCell>Variant</TableCell>
                  <TableCell align="right">Latency Cycles</TableCell>
                  <TableCell align="right">Energy pJ</TableCell>
                  <TableCell align="right">Speedup</TableCell>
                  <TableCell align="right">Energy Eff.</TableCell>
                </TableRow>
              </TableHead>
              <TableBody>
                {rows.map((row) => (
                  <TableRow key={`${row.experiment}-${row.variant}`} hover>
                    <TableCell>{row.experiment}</TableCell>
                    <TableCell>
                      <Chip
                        size="small"
                        label={row.variant}
                        color={row.variant.includes('samba') ? 'secondary' : 'default'}
                        variant={row.variant.includes('samba') ? 'filled' : 'outlined'}
                      />
                    </TableCell>
                    <TableCell align="right">{fmt(row.latency_cycles, 0)}</TableCell>
                    <TableCell align="right">{fmt(row.energy_pj, 0)}</TableCell>
                    <TableCell align="right">{fmt(row.speedup_vs_fixed_adc, 3)}x</TableCell>
                    <TableCell align="right">{fmt(row.energy_efficiency_vs_fixed_adc, 3)}x</TableCell>
                  </TableRow>
                ))}
              </TableBody>
            </Table>
          </TableContainer>
        );
      }

      function LayerTable({ experiment }) {
        return (
          <TableContainer component={Paper} variant="outlined">
            <Table size="small">
              <TableHead>
                <TableRow>
                  <TableCell>Layer</TableCell>
                  <TableCell>Variant</TableCell>
                  <TableCell align="right">Latency</TableCell>
                  <TableCell align="right">Movement</TableCell>
                  <TableCell align="right">Util.</TableCell>
                  <TableCell align="right">ColEx</TableCell>
                  <TableCell align="right">RowEx</TableCell>
                  <TableCell align="right">Split</TableCell>
                </TableRow>
              </TableHead>
              <TableBody>
                {experiment.top_layers.map((row) => (
                  <TableRow key={`${row.layer}-${row.variant}`} hover>
                    <TableCell>{row.layer}</TableCell>
                    <TableCell>{row.variant}</TableCell>
                    <TableCell align="right">{fmt(row.latency_cycles, 0)}</TableCell>
                    <TableCell align="right">{fmt(row.movement_cycles, 0)}</TableCell>
                    <TableCell align="right">{fmt(row.utilization * 100, 1)}%</TableCell>
                    <TableCell align="right">{row.column_swaps}</TableCell>
                    <TableCell align="right">{row.row_swaps}</TableCell>
                    <TableCell align="right">{row.split_mvmus}</TableCell>
                  </TableRow>
                ))}
              </TableBody>
            </Table>
          </TableContainer>
        );
      }

      function App() {
        const [data, setData] = React.useState(null);
        const [view, setView] = React.useState(() => {
          const hashView = window.location.hash.replace('#', '');
          return ['headline', 'variants', 'layers'].includes(hashView) ? hashView : 'headline';
        });
        const [selectedRun, setSelectedRun] = React.useState('');

        React.useEffect(() => {
          fetch('../data/dashboard.json')
            .then((response) => response.json())
            .then((payload) => {
              setData(payload);
              setSelectedRun(payload.experiments?.[0]?.run_name ?? '');
            });
        }, []);

        if (!data) {
          return (
            <ThemeProvider theme={theme}>
              <CssBaseline />
              <Container sx={{ py: 6 }}>
                <Typography variant="h6">Loading SAMBA results...</Typography>
                <LinearProgress sx={{ mt: 2 }} />
              </Container>
            </ThemeProvider>
          );
        }

        const rows = data.suite.runs;
        const sambaRows = rows.filter((row) => row.variant.includes('samba'));
        const fullResnet = sambaRows.find((row) => row.experiment.startsWith('full_resnet50'));
        const bestSpeed = [...sambaRows].sort((a, b) => b.speedup_vs_fixed_adc - a.speedup_vs_fixed_adc)[0];
        const selectedExperiment =
          data.experiments.find((experiment) => experiment.run_name === selectedRun) ??
          data.experiments[0];

        return (
          <ThemeProvider theme={theme}>
            <CssBaseline />
            <AppBar position="sticky" color="inherit" elevation={0} sx={{ borderBottom: '1px solid #d9dee8' }}>
              <Toolbar>
                <Typography variant="h6" sx={{ flexGrow: 1 }}>
                  SAMBA Results Dashboard
                </Typography>
                <Button size="small" variant="outlined" href="/data/dashboard.json">
                  Data JSON
                </Button>
              </Toolbar>
            </AppBar>

            <Container maxWidth="xl" sx={{ py: 3 }}>
              <Stack spacing={3}>
                <Paper variant="outlined" sx={{ p: 2.5 }}>
                  <Stack direction={{ xs: 'column', md: 'row' }} gap={2} alignItems={{ md: 'center' }}>
                    <Box sx={{ flex: 1 }}>
                      <Typography variant="h4">SAMBA Accelerator Results</Typography>
                      <Typography color="text.secondary" sx={{ mt: 1, maxWidth: 920 }}>
                        A presentation-ready React + Material UI dashboard for the fixed ADC baseline,
                        sparse ADC baseline, and SAMBA optimization results.
                      </Typography>
                    </Box>
                    <ToggleButtonGroup
                      exclusive
                      value={view}
                      size="small"
                      onChange={(_, next) => {
                        if (next) {
                          setView(next);
                          window.location.hash = next;
                        }
                      }}
                    >
                      <ToggleButton value="headline">Headline</ToggleButton>
                      <ToggleButton value="variants">Variants</ToggleButton>
                      <ToggleButton value="layers">Layers</ToggleButton>
                    </ToggleButtonGroup>
                  </Stack>
                </Paper>

                <Box sx={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(220px, 1fr))', gap: 2 }}>
                  <MetricTile
                    label="Full ResNet50 Speedup"
                    value={`${fmt(fullResnet?.speedup_vs_fixed_adc, 3)}x`}
                    sub="SAMBA vs fixed ADC"
                  />
                  <MetricTile
                    label="Full ResNet50 Energy Eff."
                    value={`${fmt(fullResnet?.energy_efficiency_vs_fixed_adc, 3)}x`}
                    sub="Normalized energy efficiency"
                  />
                  <MetricTile
                    label="Best Speedup"
                    value={`${fmt(bestSpeed?.speedup_vs_fixed_adc, 3)}x`}
                    sub={bestSpeed?.experiment ?? 'No run'}
                  />
                  <MetricTile
                    label="Experiments"
                    value={String(new Set(rows.map((row) => row.experiment)).size)}
                    sub={`${rows.length} variant rows loaded`}
                  />
                </Box>

                {view === 'headline' && (
                  <Box sx={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(360px, 1fr))', gap: 2 }}>
                    <Paper variant="outlined" sx={{ p: 2.5 }}>
                      <Typography variant="h6">SAMBA Speedup</Typography>
                      <Divider sx={{ my: 2 }} />
                      <BarList rows={sambaRows} metric="speedup_vs_fixed_adc" />
                    </Paper>
                    <Paper variant="outlined" sx={{ p: 2.5 }}>
                      <Typography variant="h6">SAMBA Energy Efficiency</Typography>
                      <Divider sx={{ my: 2 }} />
                      <BarList rows={sambaRows} metric="energy_efficiency_vs_fixed_adc" />
                    </Paper>
                  </Box>
                )}

                {view === 'variants' && <VariantTable rows={rows} />}

                {view === 'layers' && (
                  <Stack spacing={2}>
                    <FormControl size="small" sx={{ maxWidth: 420 }}>
                      <InputLabel id="run-select">Experiment</InputLabel>
                      <Select
                        labelId="run-select"
                        label="Experiment"
                        value={selectedRun}
                        onChange={(event) => setSelectedRun(event.target.value)}
                      >
                        {data.experiments.map((experiment) => (
                          <MenuItem key={experiment.run_name} value={experiment.run_name}>
                            {experiment.run_name}
                          </MenuItem>
                        ))}
                      </Select>
                    </FormControl>
                    <LayerTable experiment={selectedExperiment} />
                  </Stack>
                )}

                <Paper variant="outlined" sx={{ p: 2.5 }}>
                  <Typography variant="h6">Presentation Claim</Typography>
                  <Typography color="text.secondary" sx={{ mt: 1 }}>
                    These are architectural simulation results. The dashboard shows that SAMBA reduces
                    cycles by combining sparse ADC precision, profitable load balancing, and better
                    core/tile data movement.
                  </Typography>
                </Paper>
              </Stack>
            </Container>
          </ThemeProvider>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
