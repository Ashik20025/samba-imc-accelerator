[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "samba-imc-accelerator"
version = "0.1.0"
description = "Config-driven simulator for SAMBA sparsity-aware in-memory-computing accelerator optimizations."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
authors = [
  { name = "Hanuman Akshintala" }
]

[project.scripts]
samba-sim = "samba.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
